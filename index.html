<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>优品商城</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        background: #f5f7fb;
        color: #222;
    }

    /* 顶部导航 */
    header {
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: #fff;
        padding: 16px 4%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    nav a {
        color: #fff;
        text-decoration: none;
        margin-left: 24px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.25s;
    }

    nav a:hover,
    nav a.active {
        color: #ffd166;
        font-weight: bold;
    }

    /* 横幅 */
    .banner {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        text-align: center;
        padding: 50px 20px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .container {
        width: 92%;
        max-width: 1200px;
        margin: 40px auto;
    }

    .page-title {
        font-size: 26px;
        margin-bottom: 24px;
        text-align: center;
        color: #1e3c72;
    }

    /* 页面切换 */
    .page {
        display: none;
    }

    .page.show {
        display: block;
    }

    /* 分类栏 */
    .category-bar {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 30px;
    }

    .category-btn {
        padding: 10px 22px;
        background: #fff;
        border: 1px solid #d9e2f1;
        border-radius: 30px;
        cursor: pointer;
        font-size: 14px;
        color: #333;
        transition: 0.3s;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .category-btn:hover {
        border-color: #2a5298;
        color: #2a5298;
    }

    .category-btn.active {
        background: linear-gradient(135deg, #2a5298, #1e3c72);
        color: #fff;
        border-color: #1e3c72;
    }

    /* 商品网格 */
    .goods-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
    }

    .goods-item {
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        transition: 0.4s ease;
        display: flex;
        flex-direction: column;
        border: 1px solid #eef2f8;
    }

    .goods-item:hover {
        transform: translateY(-10px);
        box-shadow: 0 18px 40px rgba(42, 82, 152, 0.18);
    }

    /* 商品图标区：更精致的渐变插画区 */
    .goods-img {
        position: relative;
        height: 200px;
        border-radius: 16px;
        margin: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .goods-img::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.8), transparent 50%);
        pointer-events: none;
    }

    .goods-img .icon {
        font-size: 72px;
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.15));
        z-index: 2;
    }

    /* 不同品类的图标区配色 */
    .cat-mobile {
        background: linear-gradient(135deg, #74ebd5, #acb6e5);
    }

    .cat-computer {
        background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
    }

    .cat-accessory {
        background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    }

    .cat-wearable {
        background: linear-gradient(135deg, #ffecd2, #fcb69f);
    }

    /* 手机与电脑：统一的精致线性插画 */
    .product-icon .device-art {
        width: 116px;
        height: 116px;
        overflow: visible;
        filter: drop-shadow(0 14px 12px rgba(30, 60, 114, 0.22));
    }

    .product-icon {
        line-height: 0;
    }

    /* 商品标签 */
    .goods-tag {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(255, 255, 255, 0.92);
        color: #2a5298;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        z-index: 3;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    /* 已加入购物车的商品件数 */
    .cart-count {
        position: absolute;
        top: 12px;
        right: 12px;
        min-width: 28px;
        height: 28px;
        padding: 0 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ff6b6b, #e63946);
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        line-height: 1;
        z-index: 4;
        box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
        pointer-events: none;
    }

    .cart-count[hidden] {
        display: none;
    }

    .goods-body {
        padding: 0 20px 22px;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .goods-name {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #222;
    }

    .goods-category {
        font-size: 12px;
        color: #888;
        margin-bottom: 10px;
    }

    .goods-price {
        color: #e63946;
        font-size: 22px;
        font-weight: bold;
        margin-top: auto;
        margin-bottom: 14px;
    }

    .add-cart-btn {
        background: linear-gradient(135deg, #2a5298, #1e3c72);
        color: #fff;
        padding: 11px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.3s;
        letter-spacing: 1px;
    }

    .add-cart-btn:hover {
        background: linear-gradient(135deg, #1e3c72, #16305c);
        box-shadow: 0 8px 20px rgba(42, 82, 152, 0.3);
    }

    /* 购物车面板 */
    .cart-box {
        background: #fff;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .cart-box h2 {
        margin-bottom: 20px;
        color: #1e3c72;
    }

    .cart-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px dashed #e5e7eb;
    }

    .cart-item-info {
        font-size: 15px;
    }

    .cart-item-name {
        font-weight: 600;
        margin-bottom: 4px;
    }

    .cart-item-price {
        color: #666;
        font-size: 14px;
    }

    .cart-actions {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
    }

    .total-price {
        margin-left: auto;
        font-size: 20px;
        color: #e63946;
        font-weight: bold;
    }

    .clear-btn {
        background: #6c757d;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    .pay-btn {
        background: linear-gradient(135deg, #06d6a0, #118c70);
        color: #fff;
        padding: 10px 24px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    .del-btn {
        background: #ef476f;
        color: #fff;
        padding: 6px 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
    }

    .empty-cart {
        text-align: center;
        color: #999;
        padding: 40px 0;
    }

    /* 我的页面 */
    .user-card {
        background: #fff;
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .user-avatar {
        font-size: 80px;
        margin-bottom: 16px;
    }

    .user-card h2 {
        margin-bottom: 12px;
        color: #1e3c72;
    }

    .user-card p {
        color: #666;
        margin-top: 8px;
    }

    footer {
        background: #1e3c72;
        color: #cfd8ff;
        text-align: center;
        padding: 24px;
        margin-top: 60px;
    }

    /* 手机端 */
    @media (max-width: 992px) {
        .goods-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 768px) {
        header {
            padding: 14px 4%;
        }

        nav a {
            margin-left: 14px;
            font-size: 14px;
        }

        .banner {
            font-size: 22px;
            padding: 40px 16px;
        }

        .goods-grid {
            grid-template-columns: 1fr;
        }

        .cart-actions {
            flex-direction: column;
            align-items: flex-start;
        }

        .total-price {
            margin-left: 0;
        }
    }
</style>
</head>

<body>
<header>
    <div class="logo">优品商城</div>
    <nav>
        <a onclick="switchPage('home')" class="active">首页</a>
        <a onclick="switchPage('goods')">全部商品</a>
        <a onclick="switchPage('cart')">购物车</a>
        <a onclick="switchPage('mine')">我的</a>
    </nav>
</header>

<div class="banner">精选好物 · 品质生活 · 放心选购</div>

<div class="container">

    <!-- 首页 -->
    <div class="page show" id="home">
        <h2 class="page-title">🔥 热门推荐</h2>
        <div class="category-bar">
            <button class="category-btn active" onclick="filterCategory('全部', 'home')">全部</button>
            <button class="category-btn" onclick="filterCategory('手机', 'home')">手机</button>
            <button class="category-btn" onclick="filterCategory('电脑', 'home')">电脑</button>
            <button class="category-btn" onclick="filterCategory('配件', 'home')">配件</button>
            <button class="category-btn" onclick="filterCategory('智能穿戴', 'home')">智能穿戴</button>
        </div>
        <div class="goods-grid" id="homeGrid"></div>
    </div>

    <!-- 全部商品页 -->
    <div class="page" id="goods">
        <h2 class="page-title">📦 全部商品</h2>
        <div class="category-bar">
            <button class="category-btn active" onclick="filterCategory('全部', 'goods')">全部</button>
            <button class="category-btn" onclick="filterCategory('手机', 'goods')">手机</button>
            <button class="category-btn" onclick="filterCategory('电脑', 'goods')">电脑</button>
            <button class="category-btn" onclick="filterCategory('配件', 'goods')">配件</button>
            <button class="category-btn" onclick="filterCategory('智能穿戴', 'goods')">智能穿戴</button>
        </div>
        <div class="goods-grid" id="goodsGrid"></div>
    </div>

    <!-- 购物车页 -->
    <div class="page" id="cart">
        <div class="cart-box">
            <h2>🛒 我的购物车</h2>
            <div id="cartList"></div>
            <div class="cart-actions">
                <button class="clear-btn" onclick="clearCart()">清空购物车</button>
                <button class="pay-btn" onclick="submitOrder()">提交结算下单</button>
                <div class="total-price">合计：¥<span id="totalPrice">0</span></div>
            </div>
        </div>
    </div>

    <!-- 我的页面 -->
    <div class="page" id="mine">
        <div class="user-card">
            <div class="user-avatar">👤</div>
            <h2>欢迎，用户</h2>
            <p>账号：demo_user</p>
            <p>会员等级：普通会员</p>
            <p>邮箱：demo@example.com</p>
        </div>
    </div>

</div>

<footer>版权所有 © 优品商城 2026</footer>

<script>
    // 商品数据：16个商品，分4个品类
    const GOODS_STORAGE_KEY = 'haowu_products_v1';

    const defaultGoodsList = [
        { id: 1, name: "智能手机 Pro", category: "手机", price: 3299, icon: "📱", tag: "新品", catClass: "cat-mobile" },

    ];

    // 与 admin 共用同一份商品数据；仅在首次打开或缓存无效时写入默认商品
    const initialGoodsList = defaultGoodsList.map(item => ({
        ...item,
        spec: '标准版',
        stock: 100,
        status: 1
    }));

    function normalizeGoodsList(list) {
        return list.map(item => {
            const defaultItem = initialGoodsList.find(goods => goods.id === Number(item.id)) || {};
            return {
                spec: '标准版',
                icon: '🛍️',
                tag: '推荐',
                catClass: 'cat-accessory',
                ...defaultItem,
                ...item,
                id: Number(item.id),
                stock: Number(item.stock ?? defaultItem.stock ?? 100),
                status: Number(item.status ?? defaultItem.status ?? 1) === 0 ? 0 : 1
            };
        });
    }

    function loadGoods() {
        const storedGoods = localStorage.getItem(GOODS_STORAGE_KEY);

        if (storedGoods === null) {
            localStorage.setItem(GOODS_STORAGE_KEY, JSON.stringify(initialGoodsList));
            return initialGoodsList;
        }

        try {
            const parsedGoods = JSON.parse(storedGoods);
            if (!Array.isArray(parsedGoods)) throw new Error('商品缓存格式错误');
            return normalizeGoodsList(parsedGoods);
        } catch (error) {
            localStorage.setItem(GOODS_STORAGE_KEY, JSON.stringify(initialGoodsList));
            console.warn('商品缓存读取失败，已恢复默认商品。', error);
            return initialGoodsList;
        }
    }

    let cart = [];

    // 页面切换
    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
        document.getElementById(pageId).classList.add('show');

        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        event.target.classList.add('active');

        if (pageId === 'home') renderGoods('homeGrid', '全部');
        if (pageId === 'goods') renderGoods('goodsGrid', '全部');
        if (pageId === 'cart') renderCart();
    }

    // 两个页面共用首页图标，并隔离 SVG 内部 ID，避免跨页面引用串色
    function getProductIcon(item, gridId) {
        const icon = productIcons[item.id];
        if (!icon) return item.icon;

        const prefix = `${gridId}-product-${item.id}-`;
        return icon
            .replace(/id="([^"]+)"/g, `id="${prefix}$1"`)
            .replace(/url\(#([^)]+)\)/g, `url(#${prefix}$1)`);
    }

    // 渲染商品列表
    function renderGoods(gridId, category) {
        const grid = document.getElementById(gridId);
        let list = goodsList.filter(item => item.status === 1);

        if (category !== '全部') {
            list = list.filter(item => item.category === category);
        }

        grid.innerHTML = list.map(item => {
            const cartItem = cart.find(cartItem => cartItem.id === item.id);
            const count = cartItem ? cartItem.count : 0;

            return `
                <div class="goods-item">
                    <div class="goods-img ${item.catClass}">
                        <span class="goods-tag">${item.tag}</span>
                        <span class="cart-count" data-product-id="${item.id}" aria-label="购物车中已有 ${count} 件" ${count === 0 ? 'hidden' : ''}>${count}</span>
                        <span class="icon ${productIcons[item.id] ? 'product-icon' : ''}">${getProductIcon(item, gridId)}</span>
                    </div>
                    <div class="goods-body">
                        <div class="goods-name">${item.name}</div>
                        <div class="goods-category">${item.category}</div>
                        <div class="goods-price">¥${item.price}</div>
                        <button class="add-cart-btn" onclick="addCart(${item.id})">
                            加入购物车
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // 分类筛选
    function filterCategory(category, page) {
        const prefix = page === 'home' ? 'home' : 'goods';

        document.querySelectorAll(`#${page} .category-btn`).forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        renderGoods(`${prefix}Grid`, category);
    }

    // 下架商品自动移出购物车，其他商品同步最新名称和价格
    function syncCartWithGoods() {
        cart = cart.reduce((validItems, cartItem) => {
            const product = goodsList.find(item => item.id === cartItem.id);
            if (product && product.status === 1) {
                validItems.push({
                    ...cartItem,
                    name: product.name,
                    price: product.price
                });
            }
            return validItems;
        }, []);
    }

    // 加入购物车
    function addCart(id) {
        const product = goodsList.find(item => item.id === id && item.status === 1);
        if (!product) {
            alert('该商品已下架，无法加入购物车！');
            return;
        }

        const exist = cart.find(item => item.id === id);
        if (exist) {
            exist.count += 1;
        } else {
            cart.push({ id: product.id, name: product.name, price: product.price, count: 1 });
        }
        renderCart();
    }

    // 删除单个商品
    function delItem(index) {
        cart.splice(index, 1);
        renderCart();
    }

    // 清空购物车
    function clearCart() {
        cart = [];
        renderCart();
    }

    // 提交订单并写入 admin 共用的订单缓存
    function submitOrder() {
        goodsList = loadGoods();
        syncCartWithGoods();

        if (cart.length === 0) {
            alert("购物车为空，不能下单！");
            renderGoods('homeGrid', '全部');
            renderGoods('goodsGrid', '全部');
            renderCart();
            return;
        }

        const total = cart.reduce((sum, item) => sum + item.price * item.count, 0);
        const now = new Date();
        let orders = [];

        try {
            const parsedOrders = JSON.parse(localStorage.getItem(ORDER_STORAGE_KEY) || '[]');
            orders = Array.isArray(parsedOrders) ? parsedOrders : [];
        } catch (error) {
            console.warn('订单缓存读取失败，已重新创建订单列表。', error);
        }

        orders.unshift({
            oid: `UP${now.getTime()}`,
            items: cart.map(item => ({ ...item })),
            productName: cart.map(item => `${item.name} × ${item.count}`).join('；'),
            time: now.toLocaleString('zh-CN', { hour12: false }),
            total,
            status: 'pending'
        });
        localStorage.setItem(ORDER_STORAGE_KEY, JSON.stringify(orders));

        alert(`下单成功！订单总金额：¥${total}，感谢购买！`);
        cart = [];
        renderCart();
    }

    // 同步首页和全部商品页的购物车数量角标
    function updateCartBadges() {
        document.querySelectorAll('.cart-count[data-product-id]').forEach(badge => {
            const productId = Number(badge.dataset.productId);
            const cartItem = cart.find(item => item.id === productId);
            const count = cartItem ? cartItem.count : 0;

            badge.textContent = count;
            badge.setAttribute('aria-label', `购物车中已有 ${count} 件`);
            badge.hidden = count === 0;
        });
    }

    // 渲染购物车
    function renderCart() {
        syncCartWithGoods();
        updateCartBadges();

        const cartList = document.getElementById("cartList");
        const totalPrice = document.getElementById("totalPrice");
          if (cart.length === 0) {
            cartList.innerHTML = '<div class="empty-cart">购物车是空的，请添加商品</div>';
            totalPrice.innerText = "0";
            return;
        }

        cartList.innerHTML = cart.map((item, index) => `
            <div class="cart-item">
                <div class="cart-item-info">
                    <div class="cart-item-name">${item.name}</div>
                    <div class="cart-item-price">
                        单价 ¥${item.price} × ${item.count} = ¥${item.price * item.count}
                    </div>
                </div>
                <button class="del-btn" onclick="delItem(${index})">删除</button>
            </div>
        `).join('');

        let total = cart.reduce((sum, item) => sum + item.price * item.count, 0);
        totalPrice.innerText = total;
    }

    // admin 在其他标签页修改商品后，立即刷新店铺并过滤购物车
    window.addEventListener('storage', event => {
        if (event.key !== GOODS_STORAGE_KEY) return;

        goodsList = loadGoods();
        renderGoods('homeGrid', '全部');
        renderGoods('goodsGrid', '全部');
        renderCart();
    });

    // 初始化
    renderGoods('homeGrid', '全部');
    renderGoods('goodsGrid', '全部');
    renderCart();
</script>
